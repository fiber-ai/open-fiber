name: E2E Tests

on:
  schedule:
    - cron: "0 13 * * *" # daily, ~9am ET
  pull_request:
    branches: [main]
    paths:
      - "nextjs/**"
      - ".github/workflows/e2e.yml"
  push:
    branches: [main]
    paths:
      - "nextjs/**"
      - ".github/workflows/e2e.yml"
  workflow_dispatch: {}

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: nextjs
    env:
      E2E_FIBER_API_KEY: ${{ secrets.E2E_FIBER_API_KEY }}
      E2E_TEST_LINKEDIN_URL: ${{ secrets.E2E_TEST_LINKEDIN_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: nextjs/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Run E2E suite
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: nextjs/playwright-report/
          retention-days: 14

      - name: Upload traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: nextjs/test-results/
          retention-days: 14
